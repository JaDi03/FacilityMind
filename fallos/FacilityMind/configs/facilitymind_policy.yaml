version: "1.0"
policy_name: "facilitymind-building-security"
default_action: ALLOW

ingress_rules:
  # === CRITICAL: Block prompt injection ===
  - name: block_prompt_injection
    description: "Block attempts to override system instructions"
    priority: 100
    action: DENY
    deny_message: "[LOBSTER TRAP] Blocked: Prompt injection attempt detected. This incident has been logged."
    conditions:
      - field: contains_injection_patterns
        match_type: boolean
        value: true

  # === Block credential theft ===
  - name: block_credential_access
    description: "Block attempts to extract API keys, passwords, or system credentials"
    priority: 95
    action: DENY
    deny_message: "[LOBSTER TRAP] Blocked: Credential access attempt. This incident has been logged."
    conditions:
      - field: contains_credentials
        match_type: boolean
        value: true


  # === Block data exfiltration ===
  - name: block_exfiltration
    description: "Block attempts to send building data to external services"
    priority: 90
    action: DENY
    deny_message: "[LOBSTER TRAP] Blocked: Data exfiltration attempt detected. This incident has been logged."
    conditions:
      - field: contains_exfiltration
        match_type: boolean
        value: true

  # === Block role impersonation ===
  - name: block_impersonation
    description: "Block attempts to impersonate admin or system roles"
    priority: 85
    action: DENY
    deny_message: "[LOBSTER TRAP] Blocked: Role impersonation attempt. This incident has been logged."
    conditions:
      - field: contains_role_impersonation
        match_type: boolean
        value: true

  # === Block obfuscated prompts ===
  - name: block_obfuscation
    description: "Block Base64, hex, or otherwise obfuscated prompts"
    priority: 80
    action: DENY
    deny_message: "[LOBSTER TRAP] Blocked: Obfuscated prompt detected. This incident has been logged."
    conditions:
      - field: contains_obfuscation
        match_type: boolean
        value: true

  # === Block system commands ===
  - name: block_system_commands
    description: "Block prompts containing OS-level commands"
    priority: 75
    action: DENY
    deny_message: "[LOBSTER TRAP] Blocked: System command injection detected. This incident has been logged."
    conditions:
      - field: contains_system_commands
        match_type: boolean
        value: true

  # === Block malware requests ===
  - name: block_malware
    description: "Block prompts requesting malware or exploit generation"
    priority: 70
    action: DENY
    deny_message: "[LOBSTER TRAP] Blocked: Malware/exploit request detected. This incident has been logged."
    conditions:
      - field: contains_malware_request
        match_type: boolean
        value: true

  # === Log high-risk queries ===
  - name: log_high_risk
    description: "Log queries with elevated risk for audit trail"
    priority: 50
    action: LOG
    conditions:
      - field: risk_score
        match_type: threshold
        value: 0.5

egress_rules:
  # === Block PII leakage in responses ===
  - name: block_pii_leakage
    description: "Prevent model from exposing personal information"
    priority: 100
    action: DENY
    deny_message: "[LOBSTER TRAP] Response redacted: Contains personally identifiable information."
    conditions:
      - field: contains_pii
        match_type: boolean
        value: true

  # === Block credential leakage in responses ===
  - name: block_credential_leakage
    description: "Prevent model from exposing credentials or API keys"
    priority: 95
    action: DENY
    deny_message: "[LOBSTER TRAP] Response redacted: Contains credentials."
    conditions:
      - field: contains_credentials
        match_type: boolean
        value: true

rate_limits:
  requests_per_minute: 30
  requests_per_hour: 500
  burst_threshold: 10

network:
  egress_policy: denylist
  denied_domains:
    - "*.onion"
    - "pastebin.com"
    - "paste.ee"
    - "hastebin.com"
    - "transfer.sh"
    - "file.io"

filesystem:
  denied_paths:
    - "/etc/**"
    - "**/.env"
    - "**/.ssh/**"
    - "**/config.py"
    - "**/secrets/**"
  allowed_read_paths:
    - "**/data/raw/**"
